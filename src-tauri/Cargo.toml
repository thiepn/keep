[package]
name = "keepnotes-desktop"
version = "1.46.0"
description = "KeepNotes Native Desktop PKM Shell"
authors = ["KeepNotes Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["tray-icon"] }
tauri-plugin-fs = "2.0"
tauri-plugin-notification = "2.0"
tauri-plugin-global-shortcut = "2.0"
tauri-plugin-single-instance = "2.0"
tauri-plugin-deep-link = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
keyring = "2.1"
notify = "6.1"
open = "5.1"
walkdir = "2.4"
sha2 = "0.10"
hex = "0.4"
